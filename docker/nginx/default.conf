server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' unpkg.com cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' fonts.googleapis.com 'unsafe-inline'; font-src 'self' fonts.gstatic.com unpkg.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;

    gzip on;
    gzip_types text/css text/html application/javascript application/json image/svg+xml;

    # Métricas agregadas (actualización diaria en el contenedor stats-updater)
    location ^~ /traffic/ {
        add_header Cache-Control "public, max-age=86400";
        # Re-add security headers as add_header in location block disables inheritance
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' unpkg.com cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' fonts.googleapis.com 'unsafe-inline'; font-src 'self' fonts.gstatic.com unpkg.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;
    }

    location / {
        rewrite ^/privacy-policy/?$ /privacy-policy.html last;
        rewrite ^/terms-and-conditions/?$ /terms-and-conditions.html last;
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        # Re-add security headers as add_header in location block disables inheritance
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' unpkg.com cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' fonts.googleapis.com 'unsafe-inline'; font-src 'self' fonts.gstatic.com unpkg.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;
    }
}
