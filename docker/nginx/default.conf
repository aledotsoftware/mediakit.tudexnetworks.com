server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css text/html application/javascript application/json image/svg+xml;

    location = /privacy-policy {
        return 301 /privacy-policy/;
    }

    location = /terms-and-conditions {
        return 301 /terms-and-conditions/;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
